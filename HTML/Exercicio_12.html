<!DOCTYPE html>
<html lang="pt-br">

  <head>
    <meta charset="UTF-8" />

    <title>Galeria de Fotos</title>
    <link rel="stylesheet" href="/css/Exercicio_12.css" />

  <body>

    <div class="logo">
      <img class="logo" src="/IMAGENS/logo-cliq-photos.png"alt="Logo da galeria, Cliq Photos, branco e verde."/>
      <div class="divisor" ></div>
      <p> Galeria de fotos digitais</p>
    </div> 
    
    <header class="cabecalho">
      <h1>Fotos de Animais Selvagens</h1>
      <p class="subtitulo"> Clique sobre a imagem desejada e explore nossa galeria impressionante da vida selvagem.</p>
    </header>

    <main>
      <div class="galeria">
        <!-- Linha 1 -->
        <!-- Foto 1 -->
        <figure>
          <a href="#guepardo"><img src="/IMAGENS/guepardo.jpg" alt="guepardo" class="imagem-galeria"/></a>
          <figcaption>Guepardo</figcaption>
        </figure>

        <!-- Foto 2 -->
        <figure>
          <a href="#manba-negra">
            <img src="/IMAGENS/manba-negra.jpg" alt="manba-negra" class="imagem-galeria"/></a>
          <figcaption>Manba-Negra</figcaption>
        </figure>

        <!-- Foto 3 -->
        <figure>
          <a href="#aguia">
            <img src="/IMAGENS/aguia-pescadora-africana.jpg"alt="aguia-pescadora-africana"class="imagem-galeria"/></a>
          <figcaption>Águia Pescadora Africana</figcaption>
        </figure>

        <!-- Linha 2 -->
        <!-- Foto 1 -->
        <figure>
          <a href="#leao">
            <img
              src="/IMAGENS/leao.jpg"
              alt="leao"
              class="imagem-galeria"
            />
          </a>
          <figcaption>Leão</figcaption>
        </figure>

        <!-- Foto 2 -->
        <figure>
          <a href="#girafa">
            <img
              src="/IMAGENS/girafa.jpg"
              alt="girafa na selva"
              class="imagem-galeria"
            />
          </a>
          <figcaption>Girafa</figcaption>
        </figure>

        <!-- Foto 3 -->
        <figure>
          <a href="#rinoceronte">
            <img src="/IMAGENS/rinoceronte.jpg" alt="rinoceronte andando pela selva" class="imagem-galeria"/></a>
          <figcaption>Rinoceronte</figcaption>
        </figure>

        <!-- Linha 3 -->
         <!-- Foto 1 -->
        <figure>
          <a href="#zebra">
            <img src="/IMAGENS/zebra.jpg"alt="Pessoas" class="imagem-galeria"/></a>
          <figcaption>Rinoceronte</figcaption>
        </figure>

        <!-- Foto 2 -->
        <figure>
          <a href="#elefante">
            <img src="/IMAGENS/elefante.jpg"alt="elefante selvagem" class="imagem-galeria"/></a>
          <figcaption>Elefante</figcaption>
        </figure>

        <!-- Foto 3 -->
        <figure>
          <a href="#suricate">
            <img src="/IMAGENS/suricate.jpg"alt="suricate"class="imagem-galeria"/></a>
            <figcaption class="nome_animal">Suricate</figcaption>
        </figure>

          <img
            src="/IMAGENS/guepardo.jpg"
