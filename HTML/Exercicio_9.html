<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lista de tarefas</title>
    <link rel="stylesheet" href="/CSS/Exercicio_9.css" />
  </head>
  <body>
    <div class="container">
      <h2>Tarefas</h2>
      <form>
        <div>
          <label for="tarefas" class="tarefas"><h4>Lista de Tarefas por Comodo</h4></label>

          <details>
            <summary class="titulo">Cozinha</summary>

            <div class="comodo">
              <div class="afazer">
                <input type="checkbox" name="tarefas" value="louça" />
                <label for="louça">Lavar a Louça</label>
              </div>

              <div class="afazer">
                <input type="checkbox" name="tarefas" value="lixo" />
                <label for="lixo">Tirar o Lixo</label>
              </div>

              <div class="afazer">
                <input type="checkbox" name="tarefas" value="Pia" />
                <label for="Pia">Limpar Pia</label>
              </div>

              <div class="afazer">
                <input type="checkbox" name="tarefas" value="Fogão" />
                <label for="Fogão">Limpar o Fogão</label>
              </div>

              <div class="afazer">
                <input type="checkbox" name="tarefas" value="geladeira" />
                <label for="geladeira">Limpar a Geladeira</label>
              </div>
            </div>
          </details>

          <details>
            <summary class="titulo">Quarto</summary>

            <div class="comodo">
              <div class="afazer">
                <input type="checkbox" name="tarefas" value="cama" />
                <label for="cama">Trocar Roupa de Cama</label>
              </div>

              <div class="afazer">
                <input type="checkbox" name="tarefas" value="moveis" />
                <label for="moveis">Limpar Moveis</label>
              </div>

              <div class="afazer">
                <input type="checkbox" name="tarefas" value="roupas" />
                <label for="roupas">Organizar Armario</label>
              </div>
            </div>
          </details>

          <details>
            <summary class="titulo">Sala</summary>

            <div class="comodo">
              <div class="afazer">
                <input type="checkbox" name="tarefas" value="mesa" />
                <label for="mesa">Limpar mesa de Centro</label>
              </div>

              <div class="afazer">
                <input type="checkbox" name="tarefas" value="tv" />
                <label for="tv">Limpar TV</label>
              </div>

              <div class="afazer">
                <input type="checkbox" name="terefas" value="sofa" />
                <label for="sofa">Aspirar Tapete e Sofá</label>
              </div>
            </div>
          </details>

          <details>
            <summary class="titulo">Banheiro</summary>

            <div class="comodo">
              <div>
                <input type="checkbox" name="tarefas" value="vaso" />
                <label for="vaso">Limpar Vaso Sanitário</label>
             </div>

              <div>
                <input type="checkbox" name="tarefas" value="box" />
                <label for="box">Limpar Box</label>
              </div>

              <div>
                <input type="checkbox" name="tarefas" value="torneira" />
                <label for="torneira">Limpar Pia e Torneira</label>
              </div>
            </div>
          </details>

          <div class="comodo">
            <input type="checkbox" name="tarefas" value="chao" />
            <label for="chao">Limpar o Chao de todos os comodos</label>
          </div>
        </div>
      </form>

      <div class="botoes">
        <input type="button" value="Adicionar" class="botao">
        <input type="button" value="Editar" class="botao">
        <input type="button" value="Excluir" class="botao">
      </div>
      
    </div>
  </body>
</html>
