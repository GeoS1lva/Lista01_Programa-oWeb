<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="/CSS/Exercicio_7.css">
</head>
<body>
    <!-- Seção da imagem (1/3 da tela) -->
    <div class="secao-lateral">
        <div class="arte-lateral">
            <h1>
                Bem-vindo!
            </h1>
            <img src="/IMAGENS/logo-mundo-funko.png" alt="funko-acenando-globo-mundo-funko" style="width: 60%;">
        </div>
    </div>

    <!-- Seção do formulário (2/3 da tela) -->
    <div class="secao-formulario">
        <div class="container-login">
            <div class="cabecalho-login">
                <h1>Entrar</h1>
                <p>Acesse sua conta para continuar</p>
            </div>

            <form>
                <div class="grupo-formulario">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" placeholder="Digite seu e-mail" required>
                </div>

                <div class="grupo-formulario">
                    <div class="cabecalho-senha">
                        <label for="password">Senha</label>
                        <a href="#" class="link-senha">Esqueceu a senha?</a>
                    </div>
                    <input type="password" id="password" placeholder="Digite sua senha">
                </div>

                <div class="lembrar">
                    <input type="checkbox" id="remember">
                    <label for="remember">Lembrar de mim</label>
                </div>

                <button type="submit" class="botao-login">Entrar</button>

                <div class="link-cadastro">
                    Não tem uma conta? <a href="#">Criar conta</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
